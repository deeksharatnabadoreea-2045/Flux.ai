<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Flux.ai Biological Explorer — molecules and upcoming domains.">
  <meta name="flux-deploy-sha" content="b8ce66e1ca1c8893e13dc3f33cb31523c0b33829">
  <meta name="flux-deploy-stamp" content="prod-2026-11-23-chat-origin-mol-limits-1">
  <title>Explorer — Flux.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../site.css?v=chat-origin-mol-limits-1">
</head>
<body class="site-body" data-flux-deploy="b8ce66e1ca1c8893e13dc3f33cb31523c0b33829">
  <div id="site-header-mount"></div>
  <main class="site-main page-shell" id="main">
    <header class="page-header">
      <h1 class="page-title">Biological Explorer</h1>
      <p class="muted section-intro">Choose a domain. Molecules are live via PubChem; other modules are scaffolded for future data.</p>
    </header>
    <div class="module-list" id="biology-modules"></div>
  </main>
  <footer class="site-footer" id="site-footer-mount"></footer>
  <script type="module">
    import { BIOLOGY_CATEGORIES } from "../js/molecules-pubchem.js";
    import { initSiteChrome } from "../js/site-nav.js";
    initSiteChrome();
    const list = document.getElementById("biology-modules");
    for (const cat of BIOLOGY_CATEGORIES) {
      const href = cat.id === "molecules" ? "/explorer/molecules/" : `/explorer/${cat.id}/`;
      if (cat.availability === "available") {
        const a = document.createElement("a");
        a.href = href;
        a.className = "module-row";
        a.innerHTML = `<div><h3>${cat.label}</h3><p class="muted">${cat.description}</p></div><span class="badge badge--live">${cat.statusLabel}</span>`;
        list.appendChild(a);
      } else {
        const div = document.createElement("div");
        div.className = "module-row module-row--muted";
        div.innerHTML = `<div><h3>${cat.label}</h3><p class="muted">${cat.description}</p></div><span class="badge">${cat.statusLabel}</span>`;
        list.appendChild(div);
      }
    }
  </script>
</body>
</html>
